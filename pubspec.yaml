name: isyaratin
description: Asisten komunikasi dua arah bahasa isyarat.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ">=3.9.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.0.3
  go_router: ^16.2.4
  supabase_flutter: ^2.18.3
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  flutter_svg: ^2.2.1
  intl: ^0.20.2
  uuid: ^4.5.1
  flutter_tts: ^4.2.3
  camera: ^0.12.1
  tflite_flutter: 0.12.1
  google_mlkit_commons: ^0.13.0
  google_mlkit_pose_detection: ^0.16.1
  hand_landmarker: ^3.1.0
  speech_to_text: ^7.5.0
  webview_flutter: ^4.14.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/figma/
    - assets/models/
    - assets/avatar/
    - assets/avatar/js/
    - assets/avatar/motions/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
          weight: 400
        - asset: assets/fonts/Inter.ttf
          weight: 500
        - asset: assets/fonts/Inter.ttf
          weight: 600
        - asset: assets/fonts/Inter.ttf
          weight: 700
        - asset: assets/fonts/Inter.ttf
          weight: 800
